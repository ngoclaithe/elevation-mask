services:
  api:
    build: .
    ports:
      - "8787:8080"
    environment:
      ENABLE_FLORENCE: "false"
      ENABLE_YOLO_WORLD: "true"
      ENABLE_SAM: "false"
      ENABLE_VL_CRITIC: "false"
      DEVICE: cpu
      PYTHONPATH: /app/stubs
      YOLO_CONFIG_DIR: /root/.cache/Ultralytics
    volumes:
      - job-data:/app/data
      - hf-cache:/root/.cache
    restart: unless-stopped

volumes:
  job-data:
  hf-cache:
